<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A cozy barn game: muck stalls, groom horses, teach riding lessons, and earn new horses and tack.">
<title>Willow Creek Stables</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a barn at golden hour. Barn-red sign up top, a big lit barn scene, a chalkboard chore list below; mini-games open on a canvas-tan panel. Single warm theme by design. */
:root{
  --night:#26170f; --wood:#6e4429; --wood-lt:#8f5d37; --wood-dk:#3d2517;
  --hay:#f0c25a; --hay-dk:#b4862a; --barn:#9a3226; --barn-dk:#5e1d16;
  --pasture:#5d8a4c; --canvas:#f6e6c8; --canvas-dk:#e9d3ab; --ink:#3a2418;
  --chalk:#f4efe4; --chalk-dim:#cfc6b4; --chalkboard:#2f3a32; --muted:#c7a582;
  --good:#3f8a4f; --soft:#c47a1c;
  --display:'Grandstander','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background-color:var(--night);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 72px),linear-gradient(#3a2418,#20130c);
  color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 40px;min-height:100vh;
}
button{font:inherit}
:focus-visible{outline:3px solid #7fd0ff;outline-offset:2px}
.app{max-width:1000px;margin:0 auto;display:grid;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between}
.sign{background:var(--barn);border:4px solid #f3e3c3;border-radius:10px;padding:8px 18px 10px;box-shadow:0 5px 0 var(--barn-dk);transform:rotate(-1.2deg)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.4vw,36px);margin:0;color:#fff6e2;line-height:1.1;text-wrap:balance}
.sign p{margin:2px 0 0;font-weight:800;color:#f6d8a8;font-size:14px}
.hud{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--wood-dk);border:2px solid var(--wood-lt);border-radius:12px;padding:6px 14px;display:grid;min-width:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800}
.chip b{font-family:var(--display);font-size:19px;color:var(--hay);font-weight:800}

/* scene */
.scene{position:relative;border-radius:16px;overflow:hidden;border:6px solid var(--wood-dk);box-shadow:0 12px 30px rgba(0,0,0,.45);background:#7b4a2b}
.scene svg.barn{display:block;width:100%;height:auto}
.clicky{cursor:pointer}
.clicky:focus-visible{outline:none}
.clicky:focus-visible > svg{filter:drop-shadow(0 0 6px #7fd0ff)}
.hop{animation:hop .5s ease-out}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fffaf0;color:var(--ink);border-radius:14px;padding:8px 12px;font-weight:800;font-size:clamp(12px,1.8vw,15px);max-width:min(250px,46%);box-shadow:0 4px 0 rgba(0,0,0,.25);pointer-events:none;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fffaf0}
.bubble.pop{animation:pop .25s ease-out}
@keyframes pop{from{transform:translate(-50%,-80%) scale(.7);opacity:0}}
.tail{transform-origin:84px 100px;animation:swish 5s ease-in-out infinite}
@keyframes swish{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(7deg)}86%{transform:rotate(-4deg)}}
.wag{transform-box:fill-box;transform-origin:100% 90%;animation:wag .6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
.bulb{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.55}}

/* chalkboard */
.board{background:var(--chalkboard);border:10px solid var(--wood);border-radius:12px;padding:18px;box-shadow:inset 0 0 50px rgba(0,0,0,.4),0 8px 20px rgba(0,0,0,.35)}
.board h2{font-family:var(--display);margin:0 0 12px;color:var(--chalk);font-size:24px;font-weight:800}
.chores{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.chore{display:grid;grid-template-columns:58px 1fr;gap:2px 12px;align-items:center;text-align:left;background:rgba(255,255,255,.05);border:2px dashed rgba(244,239,228,.5);border-radius:12px;padding:12px;color:var(--chalk);cursor:pointer;min-width:0}
.chore:hover:not(:disabled){background:rgba(255,255,255,.1)}
.chore:disabled{cursor:default}
.chore.done{border-style:solid;border-color:var(--hay)}
.chore .ico{grid-row:span 3;width:58px;height:58px}
.chore .t{font-family:var(--display);font-size:19px;font-weight:800;line-height:1.15}
.chore .s{font-size:13px;color:var(--chalk-dim)}
.chore .st{font-weight:800;color:var(--hay);font-size:14px}
.board-foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.big-btn{font-family:var(--display);font-weight:800;font-size:18px;background:var(--hay);color:var(--ink);border:0;border-radius:12px;padding:12px 20px;box-shadow:0 4px 0 var(--hay-dk);cursor:pointer}
.big-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--hay-dk)}
.big-btn:disabled{background:#5b5a4e;color:#bdb6a6;box-shadow:none;cursor:not-allowed}
.wood-btn{font-family:var(--display);font-weight:800;font-size:17px;background:var(--wood-lt);color:#fff3dc;border:0;border-radius:12px;padding:12px 18px;box-shadow:0 4px 0 var(--wood-dk);cursor:pointer}
.wood-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--wood-dk)}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-weight:700;padding:6px}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:13px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,12,6,.75);display:grid;place-items:center;z-index:50;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{background:var(--canvas);color:var(--ink);border-radius:18px;border:6px solid var(--wood);width:min(860px,100%);max-height:100%;overflow:auto;padding:20px;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.panel h2{font-family:var(--display);font-weight:800;color:var(--barn);margin:0;font-size:clamp(22px,3.4vw,30px);line-height:1.15;text-wrap:balance}
.panel p{margin:6px 0}
.x-btn{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--canvas-dk);color:var(--ink);font-size:22px;font-weight:800;cursor:pointer;z-index:2}
.mg-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-right:44px;margin-bottom:6px}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.step{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;background:var(--canvas-dk);color:#7a5a40}
.step.on{background:var(--barn);color:#fff}
.step.done{background:var(--good);color:#fff}
.hint{font-weight:800;font-size:17px;min-height:1.5em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:#9a7552;margin:0}

/* muck */
.stall{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:5px solid var(--wood);margin-top:8px;
  background:repeating-linear-gradient(35deg,#b48545 0 6px,#a07338 6px 10px,#c09253 10px 15px);transition:background .6s}
.stall.fresh{background:repeating-linear-gradient(35deg,#f1dfae 0 6px,#e3c98d 6px 9px,#f8ebc6 9px 14px)}
.pile{position:absolute;width:13%;border:0;padding:0;background:transparent;cursor:pointer;transition:transform .45s ease-in,opacity .45s;transform:translate(0,0)}
.pile svg{display:block;width:100%}
.pile:hover svg{transform:scale(1.06)}
.pile.fly{opacity:0;pointer-events:none}
.stink{animation:stink 1.6s ease-in-out infinite}
@keyframes stink{50%{transform:translateY(-3px);opacity:.5}}
.barrow{position:absolute;right:2%;bottom:3%;width:24%}
.barrow.bump{animation:hop .3s}
.corner-dog{position:absolute;left:1%;bottom:1%;width:18%;pointer-events:none}
.count{position:absolute;left:2%;top:3%;background:rgba(58,36,24,.88);color:#fff;font-family:var(--display);font-weight:800;padding:4px 12px;border-radius:10px;font-variant-numeric:tabular-nums}
.bare{position:absolute;width:20%;aspect-ratio:1.6;border-radius:50%;border:3px dashed rgba(255,255,255,.7);background:#7c5a33;cursor:pointer;transform:translate(-50%,-50%);color:#fff;font-weight:800;font-size:13px}
.bare.filled{background:repeating-linear-gradient(35deg,#f1dfae 0 6px,#e3c98d 6px 9px,#f8ebc6 9px 14px);border-color:transparent;color:transparent;pointer-events:none}
.water{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:12px}
.bucket{position:relative;width:120px;height:140px;background:#d9dde0;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);flex:none}
.bucket .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#7cc4ec,#3d8fc4)}
.bucket .zone{position:absolute;left:0;right:0;bottom:72%;height:18%;border-top:3px dashed var(--good);border-bottom:3px dashed var(--good);background:rgba(63,138,79,.15)}
.water-copy{flex:1;min-width:200px}

/* groom */
.groom-stage{position:relative;aspect-ratio:300/220;max-width:620px;margin:6px auto 0;touch-action:none;border-radius:14px;cursor:grab;
  background:radial-gradient(ellipse at 50% 95%,#d7b47a 0 40%,transparent 41%),linear-gradient(#e9d6b2,#e2c899)}
.groom-stage:active{cursor:grabbing}
.groom-stage > svg{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;transform:translate(-50%,-50%);width:12%;aspect-ratio:1;border:0;padding:0;border-radius:50%;background:transparent;cursor:inherit;transition:opacity .15s}
.spot.mud{background:radial-gradient(circle at 45% 40%,#6b4a2c 0 30%,#5a3c22 31% 50%,rgba(90,60,34,0) 68%)}
.spot.dust{background:radial-gradient(circle,rgba(226,214,186,.95) 0 28%,rgba(226,214,186,.55) 48%,rgba(226,214,186,0) 68%)}
.spot.tangle svg{width:100%;height:100%}
.spot.hoof{width:9%;cursor:pointer;background:radial-gradient(circle,#8b8478 0 22%,#6e675d 23% 30%,rgba(0,0,0,0) 34%);box-shadow:0 0 0 3px var(--hay);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(240,194,90,.35)}}
.spot.clean{opacity:0!important;pointer-events:none;animation:none}
.sparkle{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;animation:spark .7s ease-out forwards}
@keyframes spark{from{transform:scale(.3) rotate(0);opacity:1}to{transform:scale(1.4) rotate(90deg);opacity:0}}
.groom-stage.shiny > svg{filter:brightness(1.08) saturate(1.15) drop-shadow(0 0 10px rgba(255,236,170,.8))}
.mg-dog{width:84px;flex:none;margin-left:auto}

/* lesson */
.cuecard{font-family:var(--display);font-weight:800;font-size:clamp(18px,3vw,24px);background:#fff8ea;border:3px solid var(--wood-lt);border-radius:12px;padding:8px 14px;margin:8px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cuecard .gt{color:var(--barn);text-transform:uppercase}
.letter{display:inline-grid;place-items:center;width:1.6em;height:1.6em;background:var(--hay);border:2px solid var(--ink);border-radius:5px;font-family:var(--body)}
.arena-wrap{position:relative}
.arena-wrap canvas{display:block;width:100%;border-radius:12px}
.callout{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--good);color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;font-size:15px;max-width:90%;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.callout.soft{background:var(--soft)}
.gaits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.gait{font-family:var(--display);font-weight:800;font-size:19px;border:0;border-radius:12px;padding:12px 6px;cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.gait:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.gait[data-g=walk]{background:#4f8a52}.gait[data-g=trot]{background:#3f7fb8}.gait[data-g=canter]{background:#8a4fb8}.gait[data-g=halt]{background:#b8433a}
.progress{font-weight:700;color:#7a5a40;font-size:14px;font-variant-numeric:tabular-nums}

/* results & prizes */
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:6px 0}
.stars{display:flex;gap:6px}
.stars svg{width:48px;height:48px}
.result-art{width:min(380px,90%)}
.result-art svg{width:100%;height:auto;display:block}
.gift{width:170px;height:150px;border:0;cursor:pointer;background:none;padding:0;animation:wiggle 1.4s ease-in-out infinite}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
.prize-name{font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* tack room */
.tack{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:10px}
.tack-preview{background:linear-gradient(#e9d6b2,#dcc08e);border-radius:14px;padding:8px;position:sticky;top:0}
.tack-preview svg{width:100%;height:auto;display:block}
.tack-preview .nm{font-family:var(--display);font-weight:800;text-align:center;font-size:20px}
.tack-preview .ds{text-align:center;font-size:14px;color:#7a5a40;margin:0 0 6px}
.opt-group{margin-bottom:14px}
.opt-group h3{font-family:var(--display);font-weight:800;font-size:17px;margin:0 0 6px;color:var(--barn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{border:2px solid #c9a87a;background:#fff8ea;border-radius:999px;padding:6px 12px;font-weight:800;color:var(--ink);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.cbtn .sw{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35)}
.cbtn.on{background:var(--barn);color:#fff;border-color:var(--barn)}
.cbtn:disabled{opacity:.55;cursor:not-allowed;border-style:dashed}

/* welcome */
.welcome{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:start;padding-right:10px}
.welcome-art svg{width:100%;height:auto}
.welcome label,.welcome .lbl2{display:block;font-weight:800;margin:12px 0 4px}
.welcome input{width:100%;max-width:320px;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;border:2px solid var(--wood-lt);background:#fffaf0;color:var(--ink)}
.skins{display:flex;gap:8px;margin-bottom:16px}
.skin{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 2px rgba(0,0,0,.15)}
.skin.on{border-color:var(--barn)}
.meet{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;border-top:2px dashed #cfb48c;padding-top:14px}
.meet div{display:grid;grid-template-columns:90px 1fr;gap:10px;align-items:center;font-size:14px}
.meet b{font-family:var(--display);font-size:17px;display:block}

/* barn map */
.scene{overflow-x:auto;background:#7fae5e;-webkit-overflow-scrolling:touch}
.map-inner{position:relative;min-width:680px}
.map{display:block;width:100%;height:auto}
.hot{cursor:pointer}.hot:focus-visible{outline:none}
.hot .hl{opacity:0;transition:opacity .15s}
.hot:hover .hl,.hot:focus-visible .hl{opacity:1}
.mark{animation:markbob 1.2s ease-in-out infinite}
@keyframes markbob{50%{transform:translateY(-5px)}}
.phorse{cursor:pointer}.phorse:hover > g{filter:drop-shadow(0 0 6px #fff6c8)}
.graze{animation:graze 6s ease-in-out infinite}
@keyframes graze{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.walker{cursor:pointer}
.walking .bob{animation:bob .26s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.coin{width:1em;height:1em;vertical-align:-.15em}
.chip b .coin{width:.9em;height:.9em}
.coin-pop{font-family:var(--display);font-weight:800;color:#8a5f1a;font-size:19px;margin:0}
.cbtn.buy{border-color:var(--hay-dk);background:#fff1c7}
.shop-coins{font-family:var(--display);font-weight:800;font-size:18px;display:inline-flex;gap:6px;align-items:center;background:var(--wood-dk);color:var(--hay);padding:4px 14px;border-radius:999px}

/* horse show */
.judge-h{font-family:var(--display);font-weight:800;font-size:18px;margin:0 0 6px;color:var(--barn)}
.judge{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.judge li{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center;background:#fff8ea;border:2px solid #e3cfa8;border-radius:10px;padding:6px 10px;font-weight:700;font-size:14px;color:#8a6a50}
.judge li b{font-family:var(--display);font-size:17px;color:#a89780}
.judge li.ok{color:var(--ink);border-color:#9cc98f;background:#eef7e8}.judge li.ok b{color:var(--good)}
.score-line{font-weight:800;font-variant-numeric:tabular-nums}
.jump-btn{width:100%;margin-top:10px;font-size:22px;padding:14px}
.board-tbl{border-collapse:collapse;min-width:260px;font-variant-numeric:tabular-nums;color:var(--ink);font-size:15px}
.board-tbl td{color:var(--ink)}
.board-tbl th,.board-tbl td{padding:6px 12px;text-align:left;border-bottom:1px solid #e3cfa8}
.board-tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#9a7552}
.board-tbl tr.me td{font-weight:800;background:#fff1c7}
.cbtn.prize{border-style:dashed;background:#f3ead8}
.chip b small{font-size:12px;color:var(--chalk-dim)}

/* v2: weather, store, dogs, trail */
.wx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wx.rainy{background-color:rgba(60,80,110,.14);background-image:repeating-linear-gradient(105deg,transparent 0 16px,rgba(210,230,250,.5) 16px 17px);background-size:100% 300px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-20px 300px}}
.wx.snowy{background-color:rgba(255,255,255,.14);background-image:radial-gradient(circle,#fff 0 1.6px,transparent 2.2px),radial-gradient(circle,#fff 0 1px,transparent 1.6px);background-size:46px 46px,27px 27px;animation:snow 7s linear infinite}
@keyframes snow{to{background-position:30px 460px,-15px 270px}}
.wx.hot{background:radial-gradient(circle at 96% 2%,rgba(255,206,100,.5),rgba(255,206,100,0) 42%);animation:heat 2.5s ease-in-out infinite alternate}
@keyframes heat{to{opacity:.55}}
.wx.windy i{position:absolute;left:-3%;width:11px;height:6px;border-radius:60% 0;background:#d9a521;animation:leaf 4s linear infinite}
.wx.windy i:nth-child(odd){background:#c96a1a}
@keyframes leaf{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(55vw,-20px) rotate(360deg)}100%{transform:translate(110vw,10px) rotate(720deg)}}
.wxi{width:1.05em;height:1.05em;vertical-align:-.18em}
.wx-tip{margin:-4px 0 14px;color:var(--chalk-dim);font-weight:700;font-size:15px}
.wx-tip b{color:var(--chalk)}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.tab{border:2px solid var(--wood-lt);background:#fff8ea;border-radius:999px;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--wood-lt);color:#fff}
.store-row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff8ea;border:2px solid #e3cfa8;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.store-row.credit{grid-template-columns:minmax(0,1fr) auto;border-color:#9cc98f;background:#eef7e8}
.store-ico svg{width:56px;display:block}
.store-note{font-size:14px;color:#7a5a40}
.adopt{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.adopt-card{background:#fff8ea;border:2px solid #e3cfa8;border-radius:12px;padding:12px;display:grid;gap:6px;justify-items:center;text-align:center}
.adopt-art{width:140px;height:100px;display:grid;place-items:center}.adopt-art svg{max-width:100%;max-height:100%}
.lives{font-weight:800;color:var(--good)}
.drive{position:relative;height:170px;overflow:hidden;border-radius:12px;background:linear-gradient(#9fd0ef 0 55%,#86b862 55%)}
.drive .road{position:absolute;left:0;right:0;bottom:26px;height:36px;background:#8d949a;border-top:3px solid #6f777c}
.drive .truck{position:absolute;bottom:36px;left:-130px;width:120px;animation:drive 1.5s ease-in-out forwards}
@keyframes drive{to{left:105%}}
.drive .hint{position:absolute;top:8px;left:14px;margin:0}
.dog-big{width:min(240px,70%);position:relative;margin:0 auto}.dog-big svg{width:100%;display:block}
.hearts{position:absolute;inset:0;pointer-events:none}.hearts span{position:absolute;bottom:30%;color:#e85c8a;font-size:28px;animation:heart 1.5s ease-out forwards}
@keyframes heart{to{transform:translateY(-120px);opacity:0}}
.bales{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.bale{background:none;border:0;padding:0;cursor:pointer;aspect-ratio:1.5;border-radius:8px;transition:transform .15s}
.bale:hover{transform:scale(1.05)}
.bale svg{width:100%;height:100%;display:block}.bale.open{background:#f3ead8;display:grid;place-items:center}
.bale .empty{font-weight:800;color:#a89780;font-size:13px}
.find-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,92%);background:#fffaf0;border:4px solid var(--wood);border-radius:14px;padding:14px;display:grid;grid-template-columns:48px minmax(0,1fr);gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.find-card p{margin:4px 0}
.fc-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}.fc-ico svg{width:30px}
.wardrobe-prev svg{display:block;width:auto;max-width:100%;max-height:320px;margin:0 auto}
.strands{margin:6px 0 10px}

/* barn radio */
.mrow{display:flex;align-items:center;gap:8px;margin-top:2px}
.mbtn{font-family:var(--display);font-weight:800;font-size:15px;background:var(--hay);color:var(--ink);border:0;border-radius:8px;padding:3px 12px;cursor:pointer;box-shadow:0 2px 0 var(--hay-dk)}
.mbtn[aria-pressed=true]{background:var(--pasture);color:#fff;box-shadow:0 2px 0 #3c5e30}
#vol{width:84px;accent-color:var(--hay)}

/* arena: now cue */
.cuecard.now{background:#dff3d8;border-color:var(--good)}
.nowtag{display:none;background:var(--good);color:#fff;border-radius:999px;padding:2px 14px;margin-left:auto}
.cuecard.now .nowtag{display:inline-block;animation:pop .2s}

/* feed */
.feed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;margin-top:8px}
.feedcard{background:#fffdf6;border:2px solid #d8c29b;border-radius:6px;padding:12px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.12);transform:rotate(-1deg)}
.feedcard ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px;font-weight:800}
.feedcard li{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px dashed #d8c29b;padding-bottom:6px}
.ticks{display:flex;gap:4px}.ticks i{width:16px;height:16px;border:2px solid #9a7552;border-radius:4px}.ticks i.on{background:var(--good);border-color:var(--good)}
.trough{position:relative;min-height:130px;background:linear-gradient(#8a5a36,#6e4429);border-radius:10px 10px 40px 40px;border:4px solid var(--wood-dk);display:flex;flex-wrap:wrap;align-content:flex-end;gap:2px;padding:26px 14px 12px}
.trough-lbl{position:absolute;top:4px;left:12px;color:#f3e3c3;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.trough-item{width:44px;animation:drop .35s ease-out}.trough-item svg{width:100%;display:block}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding:10px;background:#d9bf92;border-bottom:8px solid var(--wood);border-radius:10px}
.shelf-item{display:grid;justify-items:center;gap:2px;background:#fff8ea;border:2px solid #c9a87a;border-radius:12px;padding:8px 4px;cursor:pointer;font-weight:800;font-size:13px;color:var(--ink)}
.shelf-item svg{width:44px;height:44px}
.shelf-item:disabled{opacity:.5;cursor:default}
.nope{animation:nope .35s}
@keyframes nope{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* flies */
.flystall .fwin{position:absolute;top:5%;right:4%;width:20%;aspect-ratio:1.3;background:linear-gradient(#f2a65e,#f9dda0 60%,#6f9a56 60%);border:5px solid var(--wood-dk);border-radius:4px}
.fs-horse{position:absolute;left:18%;bottom:0;width:60%;pointer-events:none}.fs-horse svg{display:block;width:100%}
.fly{position:absolute;left:0;top:0;width:44px;height:44px;padding:9px;border:0;background:transparent;cursor:pointer;z-index:2}
.fly svg{width:100%;height:100%;display:block}
.fly .wing{animation:buzz .08s linear infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes buzz{to{transform:scaleY(.4)}}
.fly.shoo{transition:transform .6s ease-in,opacity .6s;opacity:0;pointer-events:none}

/* bath + braid + tack-up */
.deco{position:absolute;inset:0;pointer-events:none}
.spot svg{width:100%;height:100%;display:block}
.spot.soap{border:3px dashed rgba(255,255,255,.95);background:rgba(255,255,255,.2)}
.spot.bubbles,.spot.drips{width:15%}
.groom-stage.wet{background:linear-gradient(#cfe0e6,#b2cad4)}
.groom-stage.shake > svg{animation:shake .22s 5}
@keyframes shake{25%{transform:translateX(-6px) rotate(-1deg)}75%{transform:translateX(6px) rotate(1deg)}}
.strands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.strand{background:var(--c);border:0;border-radius:14px;padding:18px 6px;font-family:var(--display);font-weight:800;font-size:19px;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .12s,filter .12s}
.strand.lit{transform:scale(1.08);filter:brightness(1.25);box-shadow:0 0 0 5px #fff,0 0 24px var(--c)}
.strands.wait{pointer-events:none}
.knot{position:absolute;width:4.6%;aspect-ratio:1;border-radius:50%;transform:translate(-60%,-50%);border:2px solid rgba(0,0,0,.35);animation:knot .3s ease-out}
.knot::after{content:"";position:absolute;left:50%;top:55%;width:110%;height:70%;transform:translateX(-50%);background:var(--c);clip-path:polygon(0 0,50% 50%,100% 0,100% 100%,50% 50%,0 100%)}
@keyframes knot{from{transform:translate(-60%,-50%) scale(0)}}
.tackbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center}
.tb.done{background:var(--good);box-shadow:0 4px 0 #2a5e35}
.tb:disabled{cursor:default}
canvas.lead{touch-action:none;cursor:pointer}

@media (max-width:700px){
  .chores{grid-template-columns:1fr}
  .stall{aspect-ratio:4/3}
  .gaits{grid-template-columns:repeat(2,1fr)}
  .tack{grid-template-columns:1fr}
  .tack-preview{position:static}
  .welcome{grid-template-columns:1fr}
  .welcome-art{width:120px}
  .meet{grid-template-columns:1fr}
  .mg-dog{width:64px}
  .feed{grid-template-columns:1fr}
  .shelf{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="sign"><h1>Willow Creek Stables</h1><p id="barnOf">Welcome, barn boss</p></div>
    <div class="hud">
      <div class="chip"><span class="lbl">Level</span><b id="lvl">1</b></div>
      <div class="chip"><span class="lbl">Coins</span><b id="coins">0</b></div>
      <div class="chip"><span class="lbl">Weather</span><b id="wxChip">Sunny</b></div>
      <div class="chip"><span class="lbl">Feed bags</span><b id="feedChip">3</b></div>
      <div class="chip"><span class="lbl">Next prize</span><b id="nextPrize">a hairstyle</b></div>
      <div class="chip" id="ribbonChip" hidden><span class="lbl">Trophies</span><b id="ribbons">0</b></div>
      <div class="chip"><span class="lbl">Show ribbons</span><b id="showRibs">0</b></div>
      <div class="chip"><span class="lbl">Barn radio</span><div class="mrow"><button class="mbtn" id="musicBtn" aria-pressed="false">Play</button><input type="range" id="vol" min="0" max="100" value="60" aria-label="Music volume"></div></div>
    </div>
  </header>
  <section class="scene" id="scene" aria-label="The barn"></section>
  <section class="board">
    <h2>Today's chores</h2><p class="wx-tip" id="wxTip"></p>
    <div class="chores" id="chores"></div>
    <div class="board-foot">
      <button class="big-btn" id="finishBtn" disabled>Finish the day</button>
      <button class="wood-btn" id="tackBtn">Go to the tack room</button>
      <button class="wood-btn" id="showBtn">Go to the horse show</button>
      <button class="wood-btn" id="trailBtn">Trail ride</button>
      <button class="wood-btn" id="feedBtn">Feed store</button>
      <button class="wood-btn" id="wardBtn">Wardrobe</button>
    </div>
  </section>
  <footer><span>Tip: tap a place on the map to walk there. Tap the dogs to say hi.</span><button class="link-btn" id="resetBtn">Start over</button></footer>
</div>

<div class="modal" id="modal" hidden><div class="panel" role="dialog" aria-modal="true"><button class="x-btn" id="xBtn" aria-label="Close">×</button><div id="mbody"></div></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const PI=Math.PI, TAU=PI*2;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mod=(a,m)=>((a%m)+m)%m;
function angDiff(a,b){let d=mod(a-b,TAU);if(d>PI)d-=TAU;return d}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shade(hex,amt){const n=parseInt(hex.slice(1),16);const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));return'#'+[n>>16,(n>>8)&255,n&255].map(v=>f(v).toString(16).padStart(2,'0')).join('')}
let UID=0;

/* ---------- catalog ---------- */
const HORSES={
  maple:{name:'Maple',desc:'Chestnut mare with a white blaze',coat:'#a5532b',mane:'#e0ae76',blaze:true,socks:[0]},
  clover:{name:'Clover',desc:'Paint pony with brown patches',coat:'#f3eee6',mane:'#6e4126',patches:'#7d4a2a',socks:[]},
  biscuit:{name:'Biscuit',desc:'Golden palomino with a snowy mane',coat:'#d6a043',mane:'#f6ead0',blaze:true,socks:[0,1]},
  midnight:{name:'Midnight',desc:'Black Friesian with feathery feet',coat:'#2c2521',mane:'#141110',feathers:true,socks:[]},
  peanut:{name:'Peanut',desc:'Mini pony',coat:'#8a5a3a',mane:'#f3e3c3',blaze:true,socks:[0,1],mini:true},
  pepper:{name:'Pepper',desc:'Dapple grey mare',coat:'#8d949a',mane:'#45484c',dapples:'#c4c9cd',socks:[]}
};
const MANES={natural:'Natural',buttons:'Button braids',ribbons:'Ribbon braids',rainbow:'Rainbow',flowers:'Flower crown',curly:'Curly',stars:'Star-spangled',champion:'Champion rosettes'};
const TACK={
  pad:{label:'Saddle pad',items:{none:'None',barnred:'Barn red',sky:'Sky blue',sunflower:'Sunflower stars',galaxy:'Galaxy',gold:'Gold champion'}},
  saddle:{label:'Saddle',items:{none:'None',english:'English',western:'Western'}},
  bridle:{label:'Bridle',items:{none:'None',leather:'Leather',sparkle:'Purple sparkle',gold:'Gold show'}},
  wraps:{label:'Leg wraps',items:{none:'None',strawberry:'Strawberry',rainbow:'Rainbow'}}
};
const PADS={barnred:['#9b2f27','#f3e3c3'],sky:['#7db8e6','#ffffff'],sunflower:['#f2c230','#7a4a1c'],galaxy:['#3b2a6b','#c9b6ff'],gold:['#e2b13c','#ffffff']};
const PRIZES=[{t:'mane',id:'stars'},{t:'pad',id:'galaxy'},{t:'horse',id:'clover'},{t:'wraps',id:'rainbow'},{t:'bridle',id:'gold'},{t:'horse',id:'biscuit'},{t:'mane',id:'champion'},{t:'pad',id:'gold'},{t:'horse',id:'midnight'},{t:'horse',id:'pepper'}];
const PRIZE_ONLY=PRIZES.filter(p=>p.t!=='horse').map(p=>p.t+':'+p.id);
const DEFAULT_OWNED=['horse:maple','mane:natural','pad:none','pad:barnred','saddle:none','saddle:english','bridle:none','bridle:leather','wraps:none'];
const DEFAULT_LOOK={mane:'natural',pad:'barnred',saddle:'english',bridle:'leather',wraps:'none'};
const SKINS=['#f6d2b4','#e8b48e','#c98a5e','#8d5a3b','#5e3a26'];
const STUDENTS=['Ava','Leo','Priya','Sam','Mateo','Nora','Eli','June','Rosie','Theo'];

function prizeName(p){if(p.t==='horse')return'New horse: '+HORSES[p.id].name;if(p.t==='mane')return'Hairstyle: '+MANES[p.id];return TACK[p.t].label+': '+TACK[p.t].items[p.id]}
function prizeKind(p){return !p?'a trophy':p.t==='horse'?'a new horse':p.t==='mane'?'a hairstyle':'new tack'}
const owns=(t,id)=>S.owned.includes(t+':'+id);
const lookOf=id=>Object.assign({},DEFAULT_LOOK,S.looks[id]||{},{acc:((S.accOn||{})[id]||[])});
const unlockLevel=(t,id)=>{const i=PRIZES.findIndex(p=>p.t===t&&p.id===id);return i<0?1:i+2};

/* ---------- save ---------- */
const KEY='willow-creek-save-v1';
const fresh=()=>({started:false,name:'',skin:SKINS[1],level:1,done:{muck:0,groom:0,lesson:0},owned:[...DEFAULT_OWNED],horse:'maple',looks:{},ribbons:0,coins:0,showLevel:0,showRibbons:{blue:0,red:0,yellow:0,white:0},feed:3,weather:'sunny',clothes:['shirt:plaid','hat:none','boots:brown'],outfit:{shirt:'plaid',hat:'none',boots:'brown'},animals:[],acc:{},accOn:{},journal:[],trailLevel:0,dogPlayed:{}});
function load(){try{const s=localStorage.getItem(KEY);if(s)return Object.assign(fresh(),JSON.parse(s))}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load()||fresh();

/* ---------- art ---------- */
function bow(x,y,c,s=1){return`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,0 L-7,-5 L-7,5 Z M0,0 L7,-5 L7,5 Z" fill="${c}"/><circle r="2.2" fill="${shade(c,-.25)}"/></g>`}
function flower(x,y,c){let o='';for(let i=0;i<5;i++){const a=i/5*TAU;o+=`<circle cx="${(x+Math.cos(a)*3.6).toFixed(1)}" cy="${(y+Math.sin(a)*3.6).toFixed(1)}" r="3.2" fill="${c}"/>`}return o+`<circle cx="${x}" cy="${y}" r="2.2" fill="#f6d34a"/>`}
function star(x,y,r,c){let p='';for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,rr=i%2?r*.45:r;p+=(i?'L':'M')+(x+Math.cos(a)*rr).toFixed(1)+','+(y+Math.sin(a)*rr).toFixed(1)}return`<path d="${p}Z" fill="${c}"/>`}

function horseSVG(id,look,cls='',attrs=''){
  const h=HORSES[id],u='h'+(++UID),L=Object.assign({mane:'natural',pad:'none',saddle:'none',bridle:'none',wraps:'none'},look||{});
  const coat=h.coat,far=shade(coat,-.22),mane=h.mane,maneDk=shade(mane,mane==='#141110'?.25:-.3);
  const mFill=L.mane==='rainbow'?`url(#${u}rb)`:mane;
  const crest=[[231,21],[224,32],[216,44],[208,56],[200,68],[192,80]];
  const BODY='M72,112 a78,40 0 1,0 156,0 a78,40 0 1,0 -156,0 Z';
  const NECK='M194,94 C198,70 212,46 228,28 L252,40 C246,62 238,92 224,124 Z';
  const HEAD='M224,26 C236,12 256,16 264,28 L288,62 C293,71 289,80 278,81 L265,81 C256,81 250,74 246,66 L230,46 Z';
  let o=`<svg class="horse ${cls}" ${attrs} viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${h.name} the horse">
  <defs><linearGradient id="${u}rb" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#e8505b"/><stop offset=".2" stop-color="#f59e42"/><stop offset=".4" stop-color="#f4d35e"/><stop offset=".6" stop-color="#6cc36b"/><stop offset=".8" stop-color="#4a9fe0"/><stop offset="1" stop-color="#9467d6"/></linearGradient>
  <clipPath id="${u}c"><path d="${BODY}"/><path d="${NECK}"/><path d="${HEAD}"/></clipPath></defs>
  <ellipse cx="152" cy="202" rx="112" ry="8" fill="rgba(35,18,8,.28)"/>`;
  // tail
  o+='<g class="tail">';
  if(L.mane==='curly'){for(let i=0;i<8;i++){const t=i/7;o+=`<circle cx="${(80-t*26+(i%2?5:-3)).toFixed(1)}" cy="${(102+t*76).toFixed(1)}" r="${(9-t*3).toFixed(1)}" fill="${mFill}" stroke="${maneDk}" stroke-width="1.2"/>`}}
  else o+=`<path d="M80,98 C58,108 46,140 52,184 C58,178 64,170 68,152 C72,134 78,118 88,106 Z" fill="${mFill}"/><path d="M72,118 C64,138 60,158 58,176" stroke="${maneDk}" stroke-width="1.5" fill="none" opacity=".5"/>`;
  if(L.mane==='ribbons')o+=bow(82,101,'#ef6a9a',1.5);
  o+=accArt(id,L.acc,'tail');
  o+='</g>';
  const leg=(x,y,w,hh,fill,near,idx)=>{let s=`<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="6" fill="${fill}"/>`;
    if(near&&h.socks.includes(idx))s+=`<rect x="${x}" y="166" width="${w}" height="26" rx="4" fill="#f8f4ec"/>`;
    if(L.wraps==='rainbow')s+=['#e8505b','#f59e42','#f4d35e','#6cc36b','#4a9fe0','#9467d6'].map((c,k)=>`<rect x="${x-1}" y="${160+k*4.7}" width="${w+2}" height="5" fill="${c}" opacity="${near?1:.8}"/>`).join('');
    if(L.wraps==='strawberry')s+=`<rect x="${x-1}" y="160" width="${w+2}" height="28" rx="4" fill="${near?'#de4258':'#b9374a'}"/><circle cx="${x+4}" cy="168" r="1.2" fill="#f6e27a"/><circle cx="${x+w-5}" cy="176" r="1.2" fill="#f6e27a"/><circle cx="${x+6}" cy="183" r="1.2" fill="#f6e27a"/>`;
    s+=`<rect x="${x-1}" y="190" width="${w+2}" height="10" rx="3" fill="${near?'#3a2a20':'#2a1d16'}"/>`;
    if(h.feathers)s+=`<path d="M${x-5},200 C${x-2},180 ${x+w+2},180 ${x+w+5},200 Z" fill="${near?'#221b18':'#171210'}"/>`;
    return s};
  o+=leg(107,128,15,66,far,false)+leg(186,132,14,62,far,false);
  o+=`<path d="${BODY}" fill="${coat}"/><path d="${NECK}" fill="${coat}"/><path d="${HEAD}" fill="${coat}"/>`;
  if(h.patches)o+=`<g clip-path="url(#${u}c)" fill="${h.patches}"><path d="M96,84 C120,70 146,82 140,104 C134,128 104,124 92,112 Z"/><path d="M168,96 C186,84 206,98 200,120 C194,140 170,138 166,118 Z"/><path d="M206,40 C222,30 240,44 232,62 C224,80 206,74 204,58 Z"/><path d="M80,124 C92,128 100,140 92,150 C84,152 76,140 80,124Z"/></g>`;
  if(h.dapples){o+=`<g clip-path="url(#${u}c)" fill="${h.dapples}" opacity=".75">`;for(let y=84;y<150;y+=13)for(let x=84+(y%26?6:0);x<220;x+=14)o+=`<circle cx="${x}" cy="${y}" r="4.6"/>`;o+='</g>'}
  o+=`<path d="M92,138 Q150,162 214,140" stroke="${shade(coat,-.18)}" stroke-width="3" fill="none" opacity=".5"/>`;
  o+=leg(88,128,17,70,coat,true,1)+leg(204,132,15,66,coat,true,0);
  o+=`<path d="M226,28 L223,10 L236,24 Z" fill="${far}"/><path d="M232,24 L238,6 L246,22 Z" fill="${coat}"/><path d="M235.5,20 L238,11 L242,20 Z" fill="${shade(coat,-.35)}"/>`;
  if(h.blaze)o+=`<path d="M242,27 C247,27 252,31 256,38 L282,68 C284,73 280,77 274,74 L250,46 C246,40 243,34 242,27 Z" fill="#f8f4ec"/>`;
  o+=`<circle cx="250" cy="42" r="4" fill="#1d130d"/><circle cx="251.6" cy="40.4" r="1.3" fill="#fff"/><path d="M246,38 l-3,-3 M249,37 l-1,-4" stroke="#1d130d" stroke-width="1.2"/>
  <ellipse cx="281" cy="68" rx="2.2" ry="3.2" fill="${shade(coat,-.5)}"/><path d="M268,77 q6,3 12,0" stroke="${shade(coat,-.5)}" stroke-width="1.5" fill="none"/>`;
  // mane
  const naturalMane=`<path d="M236,18 C224,28 208,50 192,88 L181,84 C189,62 200,44 210,32 C216,24 224,17 232,13 Z" fill="${mFill}"/><path d="M226,24 C214,40 202,60 190,82" stroke="${maneDk}" stroke-width="1.2" fill="none" opacity=".5"/>`;
  const forelock=`<path d="M238,23 C248,21 255,28 257,38 C250,36 244,33 240,30 Z" fill="${mFill}"/>`;
  if(L.mane==='natural'||L.mane==='rainbow'||L.mane==='flowers'||L.mane==='stars')o+=naturalMane+forelock;

function say(who,text){const inner=$('#mapInner'),b=$('#bubble');if(!inner||!b)return;const el=$(`#map [data-who="${who}"]`);if(!el)return;

  b.textContent=text;b.hidden=false;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');clearTimeout(say.t);say.t=setTimeout(()=>{b.hidden=true},3400)}

function setPos(el,x,y,dur){el.style.transition=dur?`transform ${dur}s linear`:'none';el.style.transform=`translate(${x}px,${y}px)`}
function walkTo(loc,cb){
  if(walking)return;const pts=route(kidAt,loc);if(!pts.length){cb&&cb();return}
  walking=true;const kid=$('#kid'),pdx=$('#pdx');kid.classList.add('walking');pdx.classList.add('walking');
  let [cx,cy]=posOf(kidAt),i=0;
  const leg=()=>{if(i>=pts.length){kid.classList.remove('walking');setTimeout(()=>pdx.classList.remove('walking'),350);walking=false;kidAt=loc;cb&&cb();return}
    const[nx,ny]=pts[i++],d=Math.hypot(nx-cx,ny-cy)/300;
    setPos(kid,nx,ny,d);
    const fx=nx-cx;setTimeout(()=>{if(Math.abs(fx)>2)pdx.querySelector('.flipper').setAttribute('transform',fx<0?'scale(-1,1)':'');setPos(pdx,nx+(fx<0?34:-34),ny+6,d)},300);
    cx=nx;cy=ny;setTimeout(leg,d*1000)};
  leg();
}

  function sparkle(px,py){const r=stage.getBoundingClientRect(),el=document.createElement('span');el.className='sparkle';el.style.left=(px/300*r.width)+'px';el.style.top=(py/220*r.height)+'px';el.innerHTML=`<svg viewBox="0 0 24 24">${star(12,12,11,'#fff6c8')}</svg>`;stage.appendChild(el);setTimeout(()=>el.remove(),700)}

/* ---------- mini-game: riding lesson ---------- */
function startLesson(){

  const helmet=pick(['#e25a7a','#4a90d9','#6cbf5a','#9b6ad6','#f2a33a']);

  <div class="cuecard" id="cue"></div>

  <div class="gaits">${['walk','trot','canter','halt'].map(g=>`<button class="gait" data-g="${g}">${g[0].toUpperCase()+g.slice(1)}!</button>`).join('')}</div>
  <p class="progress" id="lprog"></p>`);
  const cv=$('#arena'),ctx=cv.getContext('2d'),wrap=$('#arenaWrap');let W=0,Hh=0;
  function size(){const dpr=Math.min(2,window.devicePixelRatio||1);W=wrap.clientWidth;Hh=Math.round(W*.6);cv.width=W*dpr;cv.height=Hh*dpr;cv.style.height=Hh+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();window.addEventListener('resize',size);cleanups.push(()=>window.removeEventListener('resize',size));
  const LET=[['A',PI],['K',PI+.62],['E',1.5*PI],['H',TAU-.62],['C',0],['M',.62],['B',.5*PI],['F',PI-.62]];
  const SPEED={halt:0,walk:.26,trot:.42,canter:.58},WIN=.45;
  const sand=Array.from({length:160},()=>[Math.random(),Math.random(),Math.random()]);
  let theta=PI+.12,gait='walk',ci=0,misses=0,cue=null,done=false,trail=[],trailT=0;
  function nextCue(){let c=LET.filter(([,a])=>{const f=mod(a-theta,TAU);return f>1.1&&f<4.3});if(!c.length)c=LET;const[l,a]=pick(c);cue={l,a,g:plan[ci],armed:true};
    $('#cue').innerHTML=`Ask ${student} to <span class="gt">${cue.g}</span> at <span class="letter">${l}</span><span class="nowtag">NOW!</span>`;$('#lprog').textContent=`Cue ${ci+1} of ${plan.length}`}
  function callout(t,kind){const c=$('#callout');c.textContent=t;c.className='callout '+(kind||'');c.hidden=false;clearTimeout(callout.t);callout.t=setTimeout(()=>{c.hidden=true},1700)}

    if(Math.abs(d)<=WIN){if(g===cue.g){gait=g;callout(pick(['Perfect timing!','Nice cue!','Right on the letter!','Great call, coach!']),'good');ci++;
        if(ci>=plan.length){done=true;$('#cue').innerHTML=`${student} halted right on the letter!`;$('#lprog').textContent='All cues done';
          const stars=misses<=2?3:misses<=4?2:1;setTimeout(()=>finishChore('lesson',stars,`${student} gave ${esc(hn)} a peppermint. Poindexter howled his approval.`,poinSVG()),1500)}
        else nextCue()}
      else{misses++;callout(`Right spot! But the cue at ${cue.l} is ${cue.g.toUpperCase()}.`,'soft')}}
    else if(d<0){misses++;callout(`Not yet. Wait until ${student} reaches ${cue.l}.`,'soft')}
    else{misses++;cue.armed=false;callout(`A little late. Catch ${cue.l} next lap!`,'soft')}});
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function ell(x,y,a,b){ctx.beginPath();ctx.ellipse(x,y,a,b,0,0,TAU);ctx.fill()}
  function draw(now){
    const cx=W/2,cy=Hh/2,FW=W*.42,FH=Hh*.36,rx=FW*.8,ry=FH*.66,sc=Math.max(.75,W/560);
    ctx.fillStyle='#6d9a55';ctx.fillRect(0,0,W,Hh);
    ctx.fillStyle='#dcbf8e';rr(cx-FW,cy-FH,FW*2,FH*2,14);ctx.fill();
    ctx.fillStyle='rgba(160,120,70,.35)';sand.forEach(([u,v,s])=>{ctx.fillRect(cx-FW+u*FW*2,cy-FH+v*FH*2,1+s*1.5,1+s*1.5)});
    ctx.strokeStyle='rgba(150,105,55,.35)';ctx.lineWidth=Math.max(10,W*.03);ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,TAU);ctx.stroke();
    ctx.strokeStyle='#fbf7ee';ctx.lineWidth=4;rr(cx-FW,cy-FH,FW*2,FH*2,14);ctx.stroke();
    // letters
    LET.forEach(([l,a])=>{const px=Math.cos(a)*rx,py=Math.sin(a)*ry;const kx=Math.abs(px)>1e-6?FW/Math.abs(px):1e9,ky=Math.abs(py)>1e-6?FH/Math.abs(py):1e9;let x,y;
      if(kx<ky){x=cx+Math.sign(px)*(FW+15);y=cy+py*kx}else{x=cx+px*ky;y=cy+Math.sign(py)*(FH+15)}
      const tgt=cue&&!done&&cue.l===l;
      if(tgt){ctx.strokeStyle='rgba(240,194,90,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,15+3*Math.sin(now/180),0,TAU);ctx.stroke()}
      ctx.fillStyle=tgt?(Math.abs(angDiff(theta,a))<=WIN?'#6cbf5a':'#f0c25a'):'#fbf7ee';rr(x-11,y-11,22,22,4);ctx.fill();ctx.strokeStyle='#3a2418';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#3a2418';ctx.font='800 13px Nunito, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(l,x,y+1)});
    const hx=cx+Math.cos(theta)*rx,hy=cy+Math.sin(theta)*ry,hd=Math.atan2(ry*Math.cos(theta),-rx*Math.sin(theta));
    // trail
    trail.forEach(([x,y],i)=>{ctx.fillStyle=`rgba(110,75,40,${(i/trail.length)*.45})`;ell(x,y,2,2)});
    // instructor (you) in the center
    const ia=Math.atan2(hy-cy,hx-cx);ctx.save();ctx.translate(cx,cy);ctx.rotate(ia);ctx.scale(sc,sc);
    ctx.fillStyle='#2b1c16';ell(-9,0,9,6);ctx.fillStyle='#b8433a';ell(0,0,5,11);ctx.fillStyle='#2b1c16';ell(0,0,7,7);ctx.restore();
    ctx.fillStyle='#fbf7ee';ctx.font=`800 ${Math.round(11*sc)}px Nunito, system-ui, sans-serif`;ctx.textAlign='center';ctx.fillText(S.name||'You',cx,cy+20*sc);
    // horse + rider
    const bob=gait==='halt'?0:Math.sin(now/(gait==='canter'?90:gait==='trot'?110:180))*.8;
    ctx.save();ctx.translate(hx,hy);ctx.rotate(hd);ctx.scale(sc,sc);
    ctx.fillStyle=H.mane;ell(-21,0,8,2.6);
    ctx.fillStyle=H.coat;ctx.strokeStyle=shade(H.coat,-.35);ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(0,0,16,8,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.ellipse(16,0,8,4.6,0,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(24,0,6,3.8,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=shade(H.coat,-.3);ell(19,-3.4,1.6,1.2);ell(19,3.4,1.6,1.2);
    ctx.fillStyle=H.mane;ell(13,0,7,1.5);
    ctx.fillStyle=padColor;rr(-7,-8.5,13,17,3);ctx.fill();
    ctx.fillStyle='#3b5f8f';ell(-1,0,4.5,7.5+bob*.3);ctx.fillStyle=helmet;ell(-1+bob,0,4.2,4.2);
    ctx.restore();
  }
  let last=performance.now(),raf;
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;theta=mod(theta+SPEED[gait]*dt,TAU);
    trailT+=dt;if(trailT>.12&&gait!=='halt'){trailT=0;const cx=W/2,cy=Hh/2;trail.push([cx+Math.cos(theta)*W*.42*.8,cy+Math.sin(theta)*Hh*.36*.66]);if(trail.length>26)trail.shift()}
    if(cue&&!done){const d=angDiff(theta,cue.a);$('#cue').classList.toggle('now',Math.abs(d)<=WIN);if(d<-WIN)cue.armed=true;if(cue.armed&&d>WIN&&d<WIN+.5){cue.armed=false;callout(`No worries. ${student} will pass ${cue.l} again.`,'soft')}}
    draw(now);raf=requestAnimationFrame(frame)}
  nextCue();raf=requestAnimationFrame(frame);cleanups.push(()=>cancelAnimationFrame(raf));
}

/* ---------- shared helpers for the rotating chores ---------- */
function sparkleAt(stage,x,y,col){const r=stage.getBoundingClientRect(),el=document.createElement('span');el.className='sparkle';el.style.left=(x/300*r.width)+'px';el.style.top=(y/220*r.height)+'px';el.innerHTML=`<svg viewBox="0 0 24 24">${star(12,12,11,col||'#fff6c8')}</svg>`;stage.appendChild(el);setTimeout(()=>el.remove(),700)}
const stepChips=(names,i)=>names.map((n,k)=>`<span class="step ${k<i?'done':k===i?'on':''}">${n}</span>`).join('');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function nope(b){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope')}
function rrect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function rubbable(stage,onRub,onKey){let rub=false,lx=0,ly=0;const go=e=>{const r=stage.getBoundingClientRect();onRub(e.clientX-r.left,e.clientY-r.top,r)};
  stage.addEventListener('pointerdown',e=>{rub=true;lx=e.clientX;ly=e.clientY;try{stage.setPointerCapture(e.pointerId)}catch(_){}go(e)});
  stage.addEventListener('pointermove',e=>{if(!rub||Math.hypot(e.clientX-lx,e.clientY-ly)<5)return;lx=e.clientX;ly=e.clientY;go(e)});
  ['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,()=>{rub=false}));
  if(onKey)stage.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();onKey()}})}
function drawHorseTop(c,x,y,ang,sc,H,pad,helmet,bob){const el=(a,b,rx,ry)=>{c.beginPath();c.ellipse(a,b,rx,ry,0,0,TAU);c.fill()};
  c.save();c.translate(x,y);c.rotate(ang);c.scale(sc,sc);
  c.fillStyle=H.mane;el(-21,0,8,2.6);
  c.fillStyle=H.coat;c.strokeStyle=shade(H.coat,-.35);c.lineWidth=1;[[0,0,16,8],[16,0,8,4.6],[24,0,6,3.8]].forEach(([a,b,rx,ry])=>{c.beginPath();c.ellipse(a,b,rx,ry,0,0,TAU);c.fill();c.stroke()});
  c.fillStyle=shade(H.coat,-.3);el(19,-3.4,1.6,1.2);el(19,3.4,1.6,1.2);
  c.fillStyle=H.mane;el(13,0,7,1.5);
  c.fillStyle=pad;rrect(c,-7,-8.5,13,17,3);c.fill();
  c.fillStyle='#3b5f8f';el(-1,0,4.5,7.5);c.fillStyle=helmet;el(-1+bob,0,4.2,4.2);c.restore()}
function drawYouTop(c,x,y,ang,sc){c.save();c.translate(x,y);c.rotate(ang);c.scale(sc,sc);c.fillStyle='#2b1c16';c.beginPath();c.ellipse(-8,0,8,5.5,0,0,TAU);c.fill();c.fillStyle='#b8433a';c.beginPath();c.ellipse(0,0,4.5,10,0,0,TAU);c.fill();c.fillStyle='#2b1c16';c.beginPath();c.arc(0,0,6.5,0,TAU);c.fill();c.restore()}

/* ---------- muck C: fly patrol ---------- */

function muckFlies(){
  const hn=HORSES[S.horse].name,n=Math.min(18,6+S.level+(wx()==='hot'?4:0)),t0=performance.now();
  openModal(`<div class="mg-head"><h2>Fly patrol</h2>${poinSVG('class="mg-dog"')}</div>

  const fs=$('#fs'),win=$('#fwin');let got=0,W=fs.clientWidth,Hh=fs.clientHeight;const flies=[];

  function shoo(f,by){if(f.gone)return;f.gone=true;const wr=win.getBoundingClientRect(),fr=fs.getBoundingClientRect();
    f.el.style.transform=`translate(${wr.left-fr.left+wr.width/2-22}px,${wr.top-fr.top+wr.height/2-22}px) scale(.4)`;f.el.classList.add('shoo');setTimeout(()=>f.el.remove(),650);

    if(got===n){const per=(performance.now()-t0)/1000/n,stars=per<2.5?3:per<4.5?2:1;$('#flyhint').textContent='Fly-free! The stall is peaceful again.';
      later(()=>finishChore('muck',stars,`${esc(hn)} lets out a happy sigh. Poindexter is very proud of the fly he caught.`,poinSVG(),'No more flies!'),900)}}
  let last=performance.now(),raf,dogT=0;

    dogT+=dt;if(dogT>6){dogT=0;const live=flies.filter(f=>!f.gone);if(live.length>2&&Math.random()<.6)shoo(pick(live),'dog')}

/* ---------- groom B: bath day ---------- */
const BUBBLES=`<svg viewBox="0 0 40 40"><g fill="rgba(255,255,255,.9)" stroke="#bfe3f5" stroke-width="1"><circle cx="14" cy="16" r="9"/><circle cx="26" cy="13" r="7"/><circle cx="23" cy="26" r="8"/><circle cx="10" cy="28" r="5"/><circle cx="32" cy="25" r="5"/></g><circle cx="11" cy="13" r="2" fill="#fff"/></svg>`;
const DRIPS=`<svg viewBox="0 0 40 40"><g fill="#5fb3e4"><path d="M12,6 q6,9 0,13 q-6,-4 0,-13Z"/><path d="M27,12 q6,9 0,13 q-6,-4 0,-13Z"/><path d="M18,22 q6,9 0,13 q-6,-4 0,-13Z"/></g></svg>`;
function groomBath(){
  const hn=HORSES[S.horse].name,t0=performance.now();
  const Z=[[112,100],[150,92],[188,104],[122,132],[166,130],[212,72],[234,46],[97,170],[210,168]];
  const STEPS=[{n:'Sponge',verb:`Soap up: click and drag the sponge all over ${hn}.`,k:'soap',pos:Z},{n:'Hose',verb:'Rinse: drag the hose over the bubbles to wash them away.',k:'bubbles',pos:Z},{n:'Sweat scraper',verb:'Scrape off the extra water: drag over the drips.',k:'drips',pos:Z.filter((_,i)=>i%2===0)}];
  let step=0,spots=[];
  openModal(`<div class="mg-head"><h2>Bath day for ${esc(hn)}</h2><div class="steps" id="gsteps"></div>${poinSVG('class="mg-dog"')}</div><p class="hint" id="ghint"></p>
  <div class="groom-stage wet" id="stage" tabindex="0" aria-label="Wash rack. Drag to scrub, or press Space.">${horseSVG(S.horse,{mane:lookOf(S.horse).mane})}<div class="deco" id="deco"></div><div id="spots"></div></div>`);
  const stage=$('#stage'),spotsEl=$('#spots'),deco=$('#deco');
  const vis=k=>k==='bubbles'?BUBBLES:k==='drips'?DRIPS:'';
  function renderStep(){const st=STEPS[step];$('#gsteps').innerHTML=stepChips(STEPS.map(s=>s.n),step);$('#ghint').textContent=st.verb;
    spots=st.pos.map(([x,y])=>({x,y,hp:6}));deco.innerHTML='';
    spotsEl.innerHTML=spots.map(s=>`<div class="spot ${st.k}" style="left:${(s.x/3).toFixed(2)}%;top:${(s.y/2.2).toFixed(2)}%">${vis(st.k)}</div>`).join('')}
  function hit(i){const s=spots[i],st=STEPS[step];if(!s||s.hp<=0)return;s.hp--;const el=spotsEl.children[i];if(st.k!=='soap')el.style.opacity=Math.max(.05,s.hp/6);
    if(s.hp>0)return;el.classList.add('clean');
    if(st.k==='soap'){const d=document.createElement('div');d.className='spot bubbles';d.style.left=el.style.left;d.style.top=el.style.top;d.innerHTML=BUBBLES;deco.appendChild(d)}

      const secs=(performance.now()-t0)/1000,stars=secs<45?3:secs<75?2:1;

    else{$('#ghint').textContent=`Nice! Next up: ${STEPS[step].n}.`;later(renderStep,700)}}

/* ---------- groom C: braid the mane ---------- */
function groomBraid(){
  const H=HORSES[S.horse],hn=H.name;
  const crest=[[231,21],[224,32],[216,44],[208,56],[200,68],[192,80]];
  const COLS=[['#ef6a9a','Pink'],['#f0c25a','Gold'],['#5fa8e8','Blue']],LENS=wx()==='windy'?[4,5,6]:[3,4,5];
  let round=0,seq=[],input=[],busy=true,mistakes=0;
  openModal(`<div class="mg-head"><h2>Braid ${esc(hn)}'s mane</h2><div class="steps" id="bsteps"></div>${toastSVG('class="mg-dog"')}</div>
  <p class="hint" id="bhint">Watch the strands light up, then tap them in the same order.</p>
  <div class="strands wait" id="strands">${COLS.map(([c,n],i)=>`<button class="strand" data-i="${i}" style="--c:${c}">${n}</button>`).join('')}</div>
  <div class="groom-stage" id="stage">${horseSVG(S.horse,{mane:'natural'})}<div class="deco" id="deco"></div></div>`);
  const btns=$$('.strand'),hint=$('#bhint'),deco=$('#deco'),wrap=$('#strands'),NAMES=['Braid 1','Braid 2','Braid 3'];
  const flash=i=>{btns[i].classList.add('lit');later(()=>btns[i].classList.remove('lit'),380)};
  function play(){busy=true;input=[];wrap.classList.add('wait');hint.textContent='Watch the pattern…';
    seq.forEach((v,k)=>later(()=>flash(v),700+k*650));
    later(()=>{busy=false;wrap.classList.remove('wait');hint.textContent=`Your turn! Tap the ${seq.length} strands in the same order.`},700+seq.length*650)}
  function newRound(){$('#bsteps').innerHTML=stepChips(NAMES,round);seq=Array.from({length:LENS[round]},()=>Math.floor(Math.random()*3));play()}
  btns.forEach(b=>b.onclick=()=>{if(busy)return;const i=+b.dataset.i;flash(i);input.push(i);
    if(i!==seq[input.length-1]){mistakes++;busy=true;wrap.classList.add('wait');hint.textContent='Oops, the braid slipped! Watch again.';later(play,1000);return}
    if(input.length<seq.length)return;
    busy=true;wrap.classList.add('wait');
    [crest[round*2],crest[round*2+1]].forEach(([x,y])=>{const k=document.createElement('span');k.className='knot';k.style.cssText=`left:${x/3}%;top:${y/2.2}%;background:${H.mane};--c:${COLS[round][0]}`;deco.appendChild(k)});

    else{hint.textContent=pick(['Beautiful braid!','So neat!','Perfect over-under!']);later(newRound,1100)}});
  newRound();
}

/* ---------- lesson B: tack up ---------- */
function lessonTack(){
  const student=pick(STUDENTS),hn=HORSES[S.horse].name,L=lookOf(S.horse);
  const gear={pad:L.pad!=='none'?L.pad:'barnred',saddle:L.saddle!=='none'?L.saddle:'english',bridle:L.bridle!=='none'?L.bridle:'leather'};
  const ORDER=[
    {id:'pad',name:'Saddle pad',ok:"The pad goes on first to cushion the horse's back."},
    {id:'saddle',name:'Saddle',ok:'The saddle sits right on top of the pad.',early:'The saddle needs a pad underneath it first.'},
    {id:'girth',name:'Buckle the girth',ok:"A snug girth keeps the saddle from slipping.",early:"There's no saddle to buckle yet!"},
    {id:'bridle',name:'Bridle',ok:'Bridle on, reins over the neck. Almost ready!',early:'The bridle goes on after the saddle is buckled.'},
    {id:'helmet',name:`${student}'s helmet`,ok:`${student} buckles their helmet. Safety first!`,early:'Get the horse all tacked up before the rider gears up.'}];
  const DECOYS=[{id:'tiara',name:"Princess Toast's tiara",line:"That's Princess Toast's tiara! She snorts and takes it back."},{id:'glasses',name:"Poindexter's glasses",line:'Poindexter needs those to read the barn mail!'}];
  let k=0,mistakes=0;const look={mane:L.mane,pad:'none',saddle:'none',bridle:'none'};
  openModal(`<div class="mg-head"><h2>Tack up for ${student}'s lesson</h2><div class="steps" id="tsteps"></div></div>
  <p class="hint" id="thint">Get ${esc(hn)} ready to ride. Tap the tack in the order it goes on.</p>
  <div class="groom-stage" id="stage">${horseSVG(S.horse,look)}</div>
  <div class="tackbtns">${shuffle([...ORDER,pick(DECOYS)]).map(o=>`<button class="wood-btn tb" data-id="${o.id}">${esc(o.name)}</button>`).join('')}</div>`);
  const stage=$('#stage'),hint=$('#thint');
  const chips=()=>{$('#tsteps').innerHTML=stepChips(ORDER.map((o,i)=>i<k?o.name:'Step '+(i+1)),k)};chips();
  $$('.tb').forEach(b=>b.onclick=()=>{const id=b.dataset.id,dec=DECOYS.find(d=>d.id===id);
    if(dec){mistakes++;hint.textContent=dec.line;b.disabled=true;return}
    const want=ORDER[k];
    if(id!==want.id){mistakes++;hint.textContent=ORDER.find(x=>x.id===id).early;nope(b);return}
    if(id==='pad')look.pad=gear.pad;if(id==='saddle')look.saddle=gear.saddle;if(id==='bridle')look.bridle=gear.bridle;
    stage.querySelector('svg').outerHTML=horseSVG(S.horse,look);
    sparkleAt(stage,...{pad:[152,92],saddle:[155,72],girth:[157,126],bridle:[258,52],helmet:[150,40]}[id]);
    hint.textContent='✓ '+want.ok;b.disabled=true;b.classList.add('done');k++;chips();
    if(k>=ORDER.length){const stars=mistakes===0?3:mistakes<=2?2:1;$$('.tb').forEach(x=>x.disabled=true);
      later(()=>finishChore('lesson',stars,`${student} climbed on and rode ${esc(hn)} around the arena. Poindexter supervised from the fence.`,horseSVG(S.horse,look),'Ready to ride!'),1500)}});
}

/* ---------- lesson C: lead-line ride ---------- */
function lessonLead(){
  const student=pick(STUDENTS),H=HORSES[S.horse],hn=H.name,L=lookOf(S.horse);
  const helmet=pick(['#e25a7a','#4a90d9','#6cbf5a','#9b6ad6','#f2a33a']),pad=L.pad!=='none'?PADS[L.pad][0]:'#6b3a1f';
  const PRE=[[[.22,.3,0],[.5,.2,0],[.8,.36,1],[.68,.76,0],[.36,.74,0]],[[.25,.72,0],[.28,.3,1],[.56,.5,0],[.82,.28,1],[.8,.74,0]],[[.5,.25,1],[.8,.5,0],[.52,.78,1],[.22,.6,0],[.46,.5,1]]];
  const gates=pick(PRE).map(([u,v,o])=>({u,v,a:o?PI/2:0,done:false,knock:[false,false]}));
  openModal(`<div class="mg-head"><h2>Lead-line ride with ${student}</h2>${toastSVG('class="mg-dog"')}</div>
  <p class="hint">${student} is brand new to riding. Tap or drag in the arena to lead ${esc(hn)}. Walk through the cone gates in number order.</p>
  <div class="arena-wrap" id="arenaWrap"><canvas id="arena" class="lead" aria-label="Arena with numbered cone gates"></canvas><div class="callout" id="callout" hidden></div></div>
  <p class="progress" id="lprog">Gate 1 of ${gates.length}</p>`);
  const cv=$('#arena'),ctx=cv.getContext('2d'),wrap=$('#arenaWrap');let W=0,Hh=0;
  function size(){const dpr=Math.min(2,window.devicePixelRatio||1);W=wrap.clientWidth;Hh=Math.round(W*.62);cv.width=W*dpr;cv.height=Hh*dpr;cv.style.height=Hh+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();window.addEventListener('resize',size);cleanups.push(()=>window.removeEventListener('resize',size));
  const sand=Array.from({length:160},()=>[Math.random(),Math.random(),Math.random()]);
  let hx=.06,hy=.5,tx=.06,ty=.5,ang=0,next=0,bumps=0,done=false,drag=false,walkT=0;
  const box=()=>({x0:W*.04,y0:Hh*.06,fw:W*.92,fh:Hh*.88});
  const toPx=(u,v)=>{const b=box();return[b.x0+u*b.fw,b.y0+v*b.fh]};
  function setT(e){const r=cv.getBoundingClientRect(),b=box();tx=Math.max(.03,Math.min(.97,(e.clientX-r.left-b.x0)/b.fw));ty=Math.max(.05,Math.min(.95,(e.clientY-r.top-b.y0)/b.fh))}
  cv.addEventListener('pointerdown',e=>{drag=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}setT(e)});
  cv.addEventListener('pointermove',e=>{if(drag)setT(e)});
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{drag=false}));
  function callout(t,kind){const c=$('#callout');c.textContent=t;c.className='callout '+(kind||'');c.hidden=false;clearTimeout(callout.t);callout.t=setTimeout(()=>{c.hidden=true},1500)}
  function draw(now){const b=box(),gw=W*.07,cr=Math.max(5,W*.013),sc=Math.max(.75,W/560);
    ctx.fillStyle='#6d9a55';ctx.fillRect(0,0,W,Hh);ctx.fillStyle='#dcbf8e';rrect(ctx,b.x0,b.y0,b.fw,b.fh,14);ctx.fill();
    ctx.fillStyle='rgba(160,120,70,.35)';sand.forEach(([u,v,s])=>ctx.fillRect(b.x0+u*b.fw,b.y0+v*b.fh,1+s*1.5,1+s*1.5));
    ctx.strokeStyle='#fbf7ee';ctx.lineWidth=4;rrect(ctx,b.x0,b.y0,b.fw,b.fh,14);ctx.stroke();
    gates.forEach((g,gi)=>{const[cx,cy]=toPx(g.u,g.v),ex=Math.cos(g.a)*gw,ey=Math.sin(g.a)*gw;
      if(g.done||(gi===next&&!done)){ctx.setLineDash(g.done?[]:[6,5]);ctx.strokeStyle=g.done?'rgba(63,138,79,.85)':'#f0c25a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx-ex,cy-ey);ctx.lineTo(cx+ex,cy+ey);ctx.stroke();ctx.setLineDash([])}
      [-1,1].forEach((s,ci)=>{const kx=cx+ex*s,ky=cy+ey*s;ctx.fillStyle='#e8742c';
        if(g.knock[ci]){ctx.beginPath();ctx.ellipse(kx,ky,cr*1.5,cr*.6,.6,0,TAU);ctx.fill()}
        else{ctx.beginPath();ctx.arc(kx,ky,cr,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(kx,ky,cr*.5,0,TAU);ctx.fill();ctx.fillStyle='#e8742c';ctx.beginPath();ctx.arc(kx,ky,cr*.22,0,TAU);ctx.fill()}});
      const lx=cx+ex*1.75,ly=cy+ey*1.75;ctx.fillStyle=g.done?'#3f8a4f':gi===next&&!done?'#f0c25a':'#fbf7ee';ctx.beginPath();ctx.arc(lx,ly,10,0,TAU);ctx.fill();ctx.strokeStyle='#3a2418';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle=g.done?'#fff':'#3a2418';ctx.font='800 12px Nunito, system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(g.done?'✓':String(gi+1),lx,ly+1)});
    const[px,py]=toPx(hx,hy);
    if(!done){const[qx,qy]=toPx(tx,ty);if(Math.hypot(qx-px,qy-py)>6){ctx.strokeStyle='rgba(58,36,24,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(qx,qy,8,0,TAU);ctx.stroke()}}
    const gx=px+Math.cos(ang)*12*sc+Math.cos(ang-PI/2)*17*sc,gy=py+Math.sin(ang)*12*sc+Math.sin(ang-PI/2)*17*sc;
    ctx.strokeStyle='#c43f6a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(px+Math.cos(ang)*22*sc,py+Math.sin(ang)*22*sc);ctx.stroke();
    drawHorseTop(ctx,px,py,ang,sc,H,pad,helmet,Math.sin(walkT*9)*.6);
    drawYouTop(ctx,gx,gy,ang,sc)}
  let last=performance.now(),raf;
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const b=box();
    const[px,py]=toPx(hx,hy),[qx,qy]=toPx(tx,ty),dx=qx-px,dy=qy-py,dist=Math.hypot(dx,dy);
    if(dist>3&&!done){const st=Math.min(dist,W*.13*dt);hx+=dx/dist*st/b.fw;hy+=dy/dist*st/b.fh;ang+=angDiff(Math.atan2(dy,dx),ang)*Math.min(1,dt*8);walkT+=dt}
    const[nx,ny]=toPx(hx,hy),gw=W*.07;
    gates.forEach(g=>{const[cx,cy]=toPx(g.u,g.v);[-1,1].forEach((s,ci)=>{if(g.knock[ci])return;if(Math.hypot(nx-(cx+Math.cos(g.a)*gw*s),ny-(cy+Math.sin(g.a)*gw*s))<W*.022){g.knock[ci]=true;bumps++;callout('Oops! Bumped a cone.','soft')}})});
    if(!done){const g=gates[next],[cx,cy]=toPx(g.u,g.v);if(Math.hypot(nx-cx,ny-cy)<W*.045){g.done=true;next++;
      if(next>=gates.length){done=true;$('#lprog').textContent='All gates done!';callout(`${student} did it!`,'good');const stars=bumps<=1?3:bumps<=3?2:1;
        later(()=>finishChore('lesson',stars,`${student} gave ${esc(hn)} a big hug. Princess Toast gave ${student} a big lick.`,horseSVG(S.horse,lookOf(S.horse)),'Great lead-line ride!'),1500)}
      else{callout(pick(['Nice!','Right through!','Good steering!']),'good');$('#lprog').textContent=`Gate ${next+1} of ${gates.length}`}}}
    draw(now);raf=requestAnimationFrame(frame)}
  raf=requestAnimationFrame(frame);cleanups.push(()=>cancelAnimationFrame(raf));
}

function confetti(){const cs=['#f0c25a','#ef6a9a','#5fa8e8','#6cbf5a','#9b6ad6','#fff'];for(let i=0;i<60;i++){const c=document.createElement('span');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=pick(cs);c.style.animationDelay=Math.random()*.6+'s';c.style.animationDuration=1.6+Math.random()*1.4+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}}
function finishDay(){
  if(!CHORES.every(c=>S.done[c.id]))return;
  const lv=S.level,p=nextPrize();let art,name;
  if(p){S.owned.push(p.t+':'+p.id);name=prizeName(p);
    if(p.t==='horse')art=horseSVG(p.id,DEFAULT_LOOK);
    else art=horseSVG(S.horse,Object.assign(lookOf(S.horse),{[p.t]:p.id},p.t==='saddle'&&lookOf(S.horse).pad==='none'?{pad:'barnred'}:{}));}
  else{S.ribbons++;name=`Champion trophy #${S.ribbons}`;art=TROPHY}
  const yard=(hasAnimal('goose')?10:0)+(hasAnimal('pony')?15:0);S.coins=(S.coins||0)+25+yard;S.level++;S.done={muck:0,groom:0,lesson:0};S.feed=Math.max(0,(S.feed||0)-1);rollWeather();save();

    $('#pBack').onclick=closeModal;
    if(p)$('#tryBtn').onclick=()=>{if(p.t==='horse'){S.horse=p.id;save();closeModal();return}const l=lookOf(S.horse);l[p.t]=p.id;if(p.t==='saddle'&&l.pad==='none')l.pad='barnred';S.looks[S.horse]=l;save();openTack()}};

$('#finishBtn').onclick=finishDay;

  {name:'Short Stirrup Jumpers',jumps:5,speed:.30,rail:.12},

  {name:'Junior Jumper Derby',jumps:7,speed:.36,rail:.16},

const RIB={blue:['#2f63b8','#6a98e0','1st'],red:['#b8352a','#e0695c','2nd'],yellow:['#d9a521','#f3d27e','3rd'],white:['#bdb6a6','#ffffff','4th']};
const RIB_ORDER=['blue','red','yellow','white'];
function rosette(kind,w=120){const[c1,c2,lab]=RIB[kind];let pet='';for(let i=0;i<18;i++){const a=i/18*TAU;pet+=`<circle cx="${(60+Math.cos(a)*40).toFixed(1)}" cy="${(58+Math.sin(a)*40).toFixed(1)}" r="9" fill="${c1}"/>`}

function turnout(){const L=lookOf(S.horse),items=[];let pts=0;

function jumpRound(C,T){
  const H=HORSES[S.horse],L=lookOf(S.horse);
  setBody(`<div class="mg-head"><h2>${C.name}</h2></div><p class="hint" id="jhint">Press Jump (or tap the ring, or the space bar) when you reach the yellow mark.</p>
  <div class="arena-wrap" id="jwrap"><canvas id="jc" class="lead" aria-label="Show jumping course"></canvas><div class="callout" id="callout" hidden></div></div>
  <button class="big-btn jump-btn" id="jumpBtn">Jump!</button><p class="progress" id="jprog"></p>`);
  const cv=$('#jc'),ctx=cv.getContext('2d'),wrap=$('#jwrap');let W=0,Hh=0;
  function size(){const dpr=Math.min(2,window.devicePixelRatio||1);W=wrap.clientWidth;Hh=Math.round(W*.5);cv.width=W*dpr;cv.height=Hh*dpr;cv.style.height=Hh+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
  size();window.addEventListener('resize',size);cleanups.push(()=>window.removeEventListener('resize',size));
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(horseSVG(S.horse,L));
  const COLS=[['#e8505b','#fff'],['#2f63b8','#fff'],['#f0c25a','#3d6aa8'],['#6cbf5a','#fff'],['#9b6ad6','#f0c25a']];
  const crowd=Array.from({length:70},(_,i)=>[Math.random(),Math.random(),pick(['#e8505b','#5fa8e8','#f0c25a','#6cbf5a','#ef6a9a','#fff','#9b6ad6'])]);
  // course laid out in units of screen width
  const jumps=[];let x=1.05;for(let i=0;i<C.jumps;i++){jumps.push({x,c:pick(COLS),passed:false,down:false,fall:0});x+=.85+Math.random()*.4}
  const finishX=x+.1,TAIR=.8;
  let dist=-.15,air=-1,faults=0,clears=0,done=false,last=performance.now(),raf;
  const callout=(t,k)=>{const c=$('#callout');c.textContent=t;c.className='callout '+(k||'');c.hidden=false;clearTimeout(callout.t);callout.t=setTimeout(()=>{c.hidden=true},1100)};
  const jump=()=>{if(air<0&&!done&&dist>-.05)air=0};
  $('#jumpBtn').onclick=jump;cv.addEventListener('pointerdown',jump);
  const key=e=>{if(e.code==='Space'||e.key===' '){e.preventDefault();jump()}};document.addEventListener('keydown',key);cleanups.push(()=>document.removeEventListener('keydown',key));
  const prog=()=>{$('#jprog').textContent=`Fence ${Math.min(jumps.filter(j=>j.passed).length+1,jumps.length)} of ${jumps.length} · Rails down: ${faults}`};prog();
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
    if(!done)dist+=C.speed*dt;
    if(air>=0){air+=dt;if(air>TAIR)air=-1}
    const u=air>=0?air/TAIR:0,lift=air>=0?4*u*(1-u):0; /* 0..1 of peak */
    const peak=wx()==='rainy'||wx()==='snowy'?.27:.30,railTop=C.rail*1.15;
    jumps.forEach(j=>{if(!j.passed&&j.x<=dist){j.passed=true;
      if(lift*peak>railTop+.01){clears++;callout(pick(['Clear!','Beautiful!','Over it!','Nice jump!']),'good')}
      else{faults++;j.down=true;callout('Rail down! Keep going.','soft')}prog()}
      if(j.down&&j.fall<1)j.fall=Math.min(1,j.fall+dt*3)});
    if(!done&&dist>=finishX){done=true;setTimeout(()=>{if($('#jc'))results(C,T,faults)},900)}
    draw(lift*peak,u);raf=requestAnimationFrame(frame)}
  function draw(liftH,u){
    const gY=Hh*.84,HX=W*.26,unit=W;
    const sky=ctx.createLinearGradient(0,0,0,gY);sky.addColorStop(0,'#9fd0ef');sky.addColorStop(1,'#e6f4fb');ctx.fillStyle=sky;ctx.fillRect(0,0,W,gY);
    // grandstand with crowd (parallax)
    const off=(dist*unit*.35)%(W*.5);
    ctx.fillStyle='#8a5a36';ctx.fillRect(0,Hh*.18,W,Hh*.3);ctx.fillStyle='#6e4429';for(let r=0;r<4;r++)ctx.fillRect(0,Hh*(.22+r*.065),W,3);
    crowd.forEach(([a,b,c])=>{let px=((a*W*1.5-off)%(W*1.5)+W*1.5)%(W*1.5);if(px>W)return;const py=Hh*(.2+Math.floor(b*4)*.065);ctx.fillStyle=c;ctx.fillRect(px,py,7,Hh*.04);ctx.fillStyle='#e8b48e';ctx.beginPath();ctx.arc(px+3.5,py-3,3.5,0,TAU);ctx.fill()});
    ctx.fillStyle='#9a3226';ctx.fillRect(0,Hh*.12,W,Hh*.06);
    for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#f3e3c3':'#9a3226';ctx.beginPath();const bx=((i*W/6-off*1.2)%(W*2)+W*2)%(W*2)-W*.1;ctx.moveTo(bx,Hh*.12);ctx.lineTo(bx+W/12,Hh*.12);ctx.lineTo(bx+W/24,Hh*.17);ctx.fill()}
    // rail fence + ground
    ctx.fillStyle='#7fae5e';ctx.fillRect(0,Hh*.48,W,gY-Hh*.48);
    ctx.fillStyle='#fbf7ee';ctx.fillRect(0,Hh*.6,W,4);ctx.fillRect(0,Hh*.68,W,4);
    for(let p=0;p<10;p++){const px=((p*W/8-dist*unit)%(W*1.25)+W*1.25)%(W*1.25)-W*.1;ctx.fillRect(px,Hh*.58,5,Hh*.14)}
    ctx.fillStyle='#dcbf8e';ctx.fillRect(0,gY,W,Hh-gY);
    ctx.fillStyle='rgba(160,120,70,.35)';for(let k=0;k<30;k++){const px=((k*53-dist*unit)%W+W)%W;ctx.fillRect(px,gY+6+(k*7)%(Hh-gY-8),3,2)}
    // fences
    jumps.forEach((j,i)=>{const sx=HX+(j.x-dist)*unit;if(sx<-60||sx>W+60)return;
      const tx=HX+(j.x-TAIR*.5*C.speed-dist)*unit;
      if(!j.passed){ctx.fillStyle='#f0c25a';rrect(ctx,tx-12,gY+3,24,7,3);ctx.fill();ctx.fillStyle='rgba(240,194,90,.35)';ctx.beginPath();ctx.moveTo(tx-7,gY-4);ctx.lineTo(tx+7,gY-4);ctx.lineTo(tx,gY+2);ctx.fill()}
      const top=gY-C.rail*Hh*1.15,pw=6,span=W*.055;
      ctx.fillStyle='#e85c8a';ctx.beginPath();ctx.ellipse(sx,gY,span*.9,6,0,0,TAU);ctx.fill();
      ctx.fillStyle='#f6d34a';for(let f=0;f<5;f++){ctx.beginPath();ctx.arc(sx-span*.7+f*span*.35,gY-4,3,0,TAU);ctx.fill()}
      ctx.fillStyle='#fbf7ee';ctx.fillRect(sx-span-pw/2,top-8,pw,gY-top+8);ctx.fillRect(sx+span-pw/2,top-8,pw,gY-top+8);
      const rails=3;for(let r=0;r<rails;r++){const ry=top+r*(gY-top)/rails*.9;
        ctx.save();if(j.down&&r===0){ctx.translate(sx,ry);ctx.rotate(j.fall*.5);ctx.translate(0,j.fall*(gY-ry-6));ctx.translate(-sx,-ry)}
        const len=span*2;for(let s=0;s<6;s++){ctx.fillStyle=s%2?j.c[1]:j.c[0];ctx.fillRect(sx-span+s*len/6,ry,len/6+1,6)}ctx.restore()}
      ctx.fillStyle='#3a2418';ctx.font='800 11px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText(String(i+1),sx-span,top-12)});
    // finish banner
    const fx=HX+(finishX-dist)*unit;if(fx<W+40){ctx.fillStyle='#3a2418';ctx.fillRect(fx,gY-Hh*.42,5,Hh*.42);for(let r=0;r<3;r++)for(let c=0;c<5;c++){ctx.fillStyle=(r+c)%2?'#fff':'#1d130d';ctx.fillRect(fx+5+c*8,gY-Hh*.42+r*8,8,8)}}
    // horse + rider
    const hw=W*.24,hh=hw*220/300,lift=liftH*Hh,bob=air<0&&!done?Math.abs(Math.sin(performance.now()/90))*3:0,ang=air>=0?-.28*(1-2*u):0;
    ctx.fillStyle='rgba(40,25,10,.22)';ctx.beginPath();ctx.ellipse(HX,gY+3,hw*.35*(1-liftH),5,0,0,TAU);ctx.fill();
    ctx.save();ctx.translate(HX,gY-lift-bob);ctx.rotate(ang);
    if(img.complete&&img.naturalWidth)ctx.drawImage(img,-hw*.52,-hh*.91,hw,hh);

    const rx=hw*(155/300-.52),ry=-hh*.91+hh*(70/220);
    ctx.fillStyle='#2b1c16';ctx.beginPath();ctx.moveTo(rx+2,ry-hh*.36);ctx.quadraticCurveTo(rx-hw*.08,ry-hh*.25,rx-hw*.1-u*4,ry-hh*.08);ctx.lineTo(rx-hw*.05,ry-hh*.08);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3f5f8f';ctx.beginPath();ctx.ellipse(rx+hw*.02,ry+hh*.02,hw*.05,hh*.09,.5,0,TAU);ctx.fill();
    ctx.fillStyle='#6b3a1f';rrect(ctx,rx+hw*.04,ry+hh*.1,hw*.035,hh*.06,3);ctx.fill();
    ctx.fillStyle='#b8433a';ctx.save();ctx.translate(rx+hw*.01,ry-hh*.14);ctx.rotate(.45);rrect(ctx,-hw*.035,-hh*.12,hw*.07,hh*.2,6);ctx.fill();ctx.restore();
    ctx.fillStyle=S.skin||'#e8b48e';ctx.beginPath();ctx.arc(rx+hw*.05,ry-hh*.3,hh*.075,0,TAU);ctx.fill();
    ctx.fillStyle='#1d1d22';ctx.beginPath();ctx.arc(rx+hw*.05,ry-hh*.32,hh*.08,PI,TAU);ctx.fill();ctx.fillRect(rx+hw*.05,ry-hh*.33,hw*.05,hh*.02);
    ctx.fillStyle='#b8433a';ctx.beginPath();ctx.ellipse(rx+hw*.11,ry-hh*.13,hw*.04,hh*.022,.6,0,TAU);ctx.fill();
    ctx.restore();
    if(dist<0){ctx.fillStyle='rgba(58,36,24,.75)';rrect(ctx,W/2-90,Hh*.05,180,30,15);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 15px Nunito, sans-serif';ctx.textAlign='center';ctx.fillText('Ready… canter on!',W/2,Hh*.05+20)}
  }
  raf=requestAnimationFrame(frame);cleanups.push(()=>cancelAnimationFrame(raf));
}

function results(C,T,faults){
  const ride=Math.max(12,60-faults*8),total=T.pts+ride+(hasAnimal('donkey')?5:0),ci=showIdx();
  const RIVALS=['Harper on Ziggy','Mason on Ladybug','Zoe on Captain','Ollie on Marshmallow','Lila on Thunder','Ezra on Pickles','Mia on Sundance','Jack on Waffles','Ruby on Moonpie','Finn on Biscotti'];
  const field=shuffle(RIVALS).slice(0,3).map(n=>({n,s:Math.max(35,Math.min(97,Math.round(58+ci*7+(Math.random()*28-14))))}));
  field.push({n:`${S.name||'You'} on ${HORSES[S.horse].name}`,s:total,me:true});
  field.sort((a,b)=>b.s-a.s||(a.me?-1:1));
  const place=field.findIndex(f=>f.me),kind=RIB_ORDER[place],coins=[50,35,20,10][place];
  S.showRibbons=S.showRibbons||{};S.showRibbons[kind]=(S.showRibbons[kind]||0)+1;S.coins=(S.coins||0)+coins;S.showLevel=S.level;
  const extra=[];if(place===0&&giveCloth('shirt:show'))extra.push('New outfit: Navy show coat!');if(place<=2&&giveCloth('boots:tall'))extra.push('New outfit: Tall show boots!');
  if(place<=1){const miss=accMissing(S.horse);if(miss.length){const k=pick(miss);extra.push(`Prize for ${HORSES[S.horse].name}: the ${accName(S.horse,k).toLowerCase()}!`+giveAcc(S.horse,k))}}save();
  if(place===0)confetti();
  const head=['You won the blue ribbon!','Second place: red ribbon!','Third place: yellow ribbon!','Fourth place: white ribbon!'][place];
  const judge=faults===0&&T.pts===40?'Judge: "A perfect round and a perfect turnout. What a team!"'
    :faults===0?'Judge: "A lovely clear round!"'+(T.pts<40?' Better turnout will earn even more points.':'')
    :T.pts<30?'Judge: "Nice riding! Grooming and a styled mane will boost your score next time."'
    :`Judge: "Beautiful turnout! Watch your takeoff spots and you'll be clear next time."`;
  setBody(`<div class="result"><p class="eyebrow">${C.name} · results</p><h2>${head}</h2><div>${rosette(kind,110)}</div>
  <p class="coin-pop">${COIN} +${coins} coins</p>
  <table class="board-tbl"><thead><tr><th>Place</th><th>Rider</th><th>Score</th></tr></thead><tbody>${field.map((f,i)=>`<tr class="${f.me?'me':''}"><td>${['1st','2nd','3rd','4th'][i]}</td><td>${esc(f.n)}</td><td>${f.s}</td></tr>`).join('')}</tbody></table>
  <p class="score-line">Turnout ${T.pts}/40 · Jumping ${ride}/60 (${faults} rail${faults===1?'':'s'} down)</p>
  ${extra.map(e=>`<p class="coin-pop">${esc(e)}</p>`).join('')}${hasAnimal('donkey')?'<p class="store-note">Hank the donkey kept your horse calm: +5 points.</p>':''}<p>${judge}</p><button class="big-btn" id="backBtn">Back to the barn</button></div>`);
  $('#backBtn').onclick=closeModal;
}

const ACC_KINDS=[['bonnet','fly bonnet'],['blanket','quarter sheet'],['tailbow','tail bow'],['glitter','hoof glitter']];

  if(m==='clover')return`<g fill="${c}"><circle cx="${x}" cy="${y-s*.5}" r="${s*.45}"/><circle cx="${x-s*.48}" cy="${y+s*.2}" r="${s*.45}"/><circle cx="${x+s*.48}" cy="${y+s*.2}" r="${s*.45}"/></g><path d="M${x},${y+s*.3} q${s*.2},${s*.6} ${s*.5},${s}" stroke="${c}" stroke-width="1.6" fill="none"/>`;
  if(m==='heart')return`<path d="M${x},${y+s*.8} C${x-s*1.2},${y-s*.1} ${x-s*.6},${y-s} ${x},${y-s*.35} C${x+s*.6},${y-s} ${x+s*1.2},${y-s*.1} ${x},${y+s*.8} Z" fill="${c}"/>`;

function accArt(id,kinds,layer){const t=HORSE_THEME[id];if(!t||!kinds||!kinds.length)return'';const has=k=>kinds.includes(k);let o='';
  if(layer==='tail'&&has('tailbow'))o+=bow(80,99,t.c,1.9)+`<circle cx="80" cy="99" r="2.6" fill="${t.c2}"/>`;
